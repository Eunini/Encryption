[project]
name = "encryption-workbench"
version = "1.0.0"
description = "Authenticated file encryption with bounded parsing and atomic, non-overwriting outputs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Inioluwa Atanda"}]
dependencies = ["cryptography>=46,<52"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
encryption = "encryption_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/encryption_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
